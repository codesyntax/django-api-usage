[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-api-usage"
version = "0.1.0"
description = "Lightweight, privacy-first usage metering for Django APIs, with an optional deprecation lifecycle layer."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "CodeSyntax", email = "teknika@codesyntax.com" }]
keywords = ["django", "api", "usage", "metrics", "deprecation", "drf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = ["Django>=4.2"]

[project.optional-dependencies]
drf = ["djangorestframework>=3.14"]
celery = ["celery>=5.2"]
redis = ["redis>=4.0"]
dev = ["pytest", "pytest-django", "black==25.1.0", "ruff==0.16.10"]

[project.urls]
Homepage = "https://gitlab.com/codesyntax/django-api-usage"
Issues = "https://gitlab.com/codesyntax/django-api-usage/-/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["src", "."]
testpaths = ["tests"]
