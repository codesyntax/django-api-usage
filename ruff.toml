# ruff.toml — ruff is used as LINTER only. The formatter is black:
# do NOT run `ruff format` (it deviates from black).
#
# IMPORTANT: keep the ruff version pinned (see lint-requirements.txt). Ruff's
# default rule set changes between versions; because `select` is declared
# explicitly here, lint cannot surprise us. This repository learned that the
# hard way: with no explicit config, `ruff check .` reported a different rule
# set depending on where the project root was detected (before/after `git init`).

target-version = "py310" # pyproject: requires-python = ">=3.10"
line-length = 88 # stay in sync with black

extend-exclude = [
    "build",
    "dist",
    ".tox",
    ".venv",
    "*.md",
]

[lint]
select = [
    "F",  # pyflakes: unused imports/variables, undefined names
    "E4", # pycodestyle: imports
    "E7", # pycodestyle: comparisons, bare except (E722)
    "E9", # pycodestyle: runtime errors
    "I",  # isort: import order (black-compatible)
    "UP", # pyupgrade: modern Python syntax (a new codebase can afford it)
]
# Candidates for later, once the reasons to skip each one are gone:
# "W", "B", "C4", "SIM", "RET", "PERF", "PIE", "TRY", "RUF", "DJ", "DTZ"
ignore = [
    "E501", # black does not split long strings/comments
    # Rules that conflict with the formatter (see ruff docs):
    "COM812",
    "COM819",
    "ISC001",
    "ISC002",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "Q004",
    "W191",
    "E111",
    "E114",
    "E117",
]

[lint.per-file-ignores]
# Migrations are generated by Django: their style is not ours to maintain.
"**/migrations/*" = ["F401", "E501", "I001", "RUF012", "DJ001", "DJ012", "UP"]

[lint.isort]
known-first-party = ["django_api_usage", "tests"]
