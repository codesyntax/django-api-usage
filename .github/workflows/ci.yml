name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: ruff + black
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned lint tools
        run: pip install -r lint-requirements.txt

      - name: ruff check
        run: ruff check .

      - name: black --check
        run: black --check --diff .

  test:
    name: tests (py${{ matrix.python-version }}, django${{ matrix.django-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        django-version: ["4.2", "5.2"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e . "Django~=${{ matrix.django-version }}.0" "djangorestframework>=3.14"

      - name: Migrations are up to date
        run: python -m django makemigrations --check --dry-run --settings=tests.settings

      - name: Tests
        run: python -m django test tests --settings=tests.settings -v 2
